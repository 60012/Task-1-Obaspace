<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Create an Account - Obasphere</title>
    <link rel="stylesheet" href="styles.css">
  </head>
  <body>
    <header class="header">
      <div class="header-container">
        <a href="index.html" class="logo">
          <span class="logo-badge">O</span>
          <span>Obasphere</span>
        </a>
        <nav class="nav">
          <a href="index.html">Home</a>
          <a href="contact.html">Contact Us</a>
          <a href="register.html" class="active">Sign Up</a>
          <a href="login.html">Sign In</a>
        </nav>
      </div>
    </header>

    <main class="main-content">
      <div class="center-layout">
        <div class="form-card">
          <h2>Create an Account</h2>
          <p class="card-desc">Sign up to get started with Obasphere</p>

          <form method="get" action="dashboard.html">
            <div class="form-row">
              <div class="form-group">
                <label for="first-name">First Name</label>
                <input
                  type="text"
                  id="first-name"
                  name="first_name"
                  class="form-input"
                  placeholder="First name"
                  required
                >
              </div>

              <div class="form-group">
                <label for="surname">Surname</label>
                <input
                  type="text"
                  id="surname"
                  name="surname"
                  class="form-input"
                  placeholder="Surname"
                  required
                >
              </div>
            </div>

            <div class="form-group">
              <label for="other-name">Other Name (Optional)</label>
              <input
                type="text"
                id="other-name"
                name="other_name"
                class="form-input"
                placeholder="Middle / other name"
              >
            </div>

            <div class="form-group">
              <label for="register-email">Email Address</label>
              <input
                type="email"
                id="register-email"
                name="email"
                class="form-input"
                placeholder="name@example.com"
                required
              >
            </div>

            <div class="form-group">
              <label for="phone">Phone Number</label>
              <div class="phone-group">
                <select id="country-code" name="country_code" class="country-select" title="Country code">
                  <option value="+234" selected>+234 (NG)</option>
                  <option value="+1">+1 (US)</option>
                  <option value="+1">+1 (CA)</option>
                  <option value="+44">+44 (UK)</option>
                  <option value="+233">+233 (GH)</option>
                  <option value="+27">+27 (ZA)</option>
                  <option value="+254">+254 (KE)</option>
                  <option value="+91">+91 (IN)</option>
                  <option value="+49">+49 (DE)</option>
                  <option value="+33">+33 (FR)</option>
                  <option value="+61">+61 (AU)</option>
                  <option value="+971">+971 (AE)</option>
                  <option value="+86">+86 (CN)</option>
                  <option value="+55">+55 (BR)</option>
                  <option value="+81">+81 (JP)</option>
                  <option value="+20">+20 (EG)</option>
                </select>
                <input
                  type="tel"
                  id="phone"
                  name="phone"
                  class="form-input phone-input"
                  placeholder="Phone number"
                  required
                >
              </div>
            </div>

            <div class="form-group">
              <label for="register-password">Password</label>
              <input
                type="password"
                id="register-password"
                name="password"
                class="form-input"
                placeholder="At least 8 characters"
                minlength="8"
                required
              >
            </div>

            <button type="submit" class="btn btn-secondary">Create Account</button>

            <hr class="divider">

            <div class="form-footer">
              <p>Already have an account? <a href="login.html">Sign in</a></p>
            </div>
          </form>
        </div>
      </div>
    </main>

    <footer class="footer">
      <ul class="footer-links">
        <li><a href="index.html">Home</a></li>
        <li><a href="contact.html">Contact Us</a></li>
        <li><a href="register.html">Sign Up</a></li>
        <li><a href="login.html">Sign In</a></li>
      </ul>
      <p>&copy; 2026 Obasphere. All rights reserved.</p>
    </footer>
  </body>
</html>
