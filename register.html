<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Register Page</title>
  <style>
    body { font-family: Arial, sans-serif; padding:20px; }
    .card { max-width:400px; margin:20px auto; padding:16px; border:1px solid #ccc; border-radius:6px; }
    input { width:100%; padding:8px; margin:6px 0; box-sizing:border-box; }
    button { padding:8px 12px; }
  </style>
</head>


<body>

 <header style="background-color: blue; color: white; padding: 30px; text-align: right; font-size: 1.5rem;">
        <h1>Welcome to Obasphere</h1>
    </header>

  <div class="card">
    <h1>Register</h1>
    <form action="login.html">
      <input name="username" placeholder="Username"><br>
      <input name="email" placeholder="Email"><br>
      <input type="password" name="password" placeholder="Password"><br>
      <input type="password" name="confirm" placeholder="Confirm password"><br>
      <button type="submit">Create account</button>
    </form>
    <p>Already have an account? <a href="login.html">Login</a></p>
  
  </div>
</body>
</html>
