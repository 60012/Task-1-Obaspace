<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Obasphere | Get in Touch</title>
  </head>
  <body background="login-bg.jpg">
    <header>
      <table width="100%" cellpadding="4" cellspacing="0" border="0">
        <tr>
          <td align="left" valign="top">
            <nav aria-label="Site navigation">
              <p><a href="index.html">Obasphere</a></p>
            </nav>
          </td>
          <td align="right" valign="top">
            <nav aria-label="Account navigation">
              <p>
                <a href="#contact-form">Contact Us</a> |
                <a href="register.html">Sign Up</a> |
                <a href="login.html">Sign In</a>
              </p>
            </nav>
          </td>
        </tr>
      </table>
    </header>

    <section id="contact-form" aria-labelledby="contact-form-title">
      <h2 id="contact-form-title">Contact Form</h2>
      <form method="post" autocomplete="on">
        <fieldset>
          <legend>Send a Message</legend>

          <p>
            <label for="contact-name">Full Name</label><br />
            <input
              type="text"
              id="contact-name"
              name="name"
              autocomplete="name"
              required
            />
          </p>

          <p>
            <label for="contact-email">Email Address</label><br />
            <input
              type="email"
              id="contact-email"
              name="email"
              autocomplete="email"
              required
            />
          </p>

          <p>
            <label for="contact-message">Message</label><br />
            <textarea
              id="contact-message"
              name="message"
              rows="6"
              cols="32"
              minlength="10"
              required
            ></textarea>
          </p>

          <p>
            <button type="submit">Send Message</button>
          </p>
        </fieldset>
      </form>
    </section>
  </body>
</html>
