<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="description" content="Sign in to your Obasphere account." />
    <title>Obasphere | Sign In</title>
  </head>
  <body background="login-bg.jpg">
    <header>
      <table width="100%" cellpadding="4" cellspacing="0" border="0">
        <tr>
          <td align="left" valign="top">
            <nav aria-label="Site navigation">
              <p><a href="index.html">Obasphere</a></p>
            </nav>
          </td>
          <td align="right" valign="top">
            <nav aria-label="Account navigation">
              <p>
                <a href="#contact-form">Contact Us</a> |
                <a href="register.html">Sign Up</a> |
                <a href="login.html">Sign In</a>
              </p>
            </nav>
          </td>
        </tr>
      </table>
    </header>

    <main>
      <section aria-labelledby="sign-in-title">
        <h1 id="sign-in-title">Sign In</h1>
        <p>Access your Obasphere account.</p>

        <form method="post" autocomplete="on">
          <fieldset>
            <legend>Account Details</legend>

            <p>
              <label for="login-email">Email Address</label><br />
              <input
                type="email"
                id="login-email"
                name="email"
                autocomplete="email"
                inputmode="email"
                required
              />
            </p>

            <p>
              <label for="login-password">Password</label><br />
              <input
                type="password"
                id="login-password"
                name="password"
                autocomplete="current-password"
                minlength="8"
                required
              />
            </p>

            <p>
              <input
                type="checkbox"
                id="remember-me"
                name="remember"
                value="yes"
              />
              <label for="remember-me">Remember me on this device</label>
            </p>

            <p>
              <button type="submit">Sign In</button>
            </p>
          </fieldset>
        </form>
      </section>
    </main>
  </body>
</html>
